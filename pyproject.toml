[project]
name = "music-manager-mcp"
version = "0.1.0"
description = "MCP server for managing and analyzing Ableton projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Upper bound is load-bearing: this server uses the mcp 1.x low-level API
    # (`from mcp.server import Server` + @server.list_tools/@server.call_tool).
    # mcp 2.0 dropped those decorators, so an unpinned >=1.0.0 silently
    # resolved to 2.x and broke startup with AttributeError.
    "mcp>=1.0.0,<2.0.0",
]

[project.scripts]
music-manager-mcp = "music_manager_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_manager_mcp"]
