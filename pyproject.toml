[project]
name = "music-manager-mcp"
version = "0.1.0"
description = "MCP server for managing and analyzing Ableton projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
music-manager-mcp = "music_manager_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_manager_mcp"]
